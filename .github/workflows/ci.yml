name: ARK checks
on:
  push:
  pull_request:
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:publishing
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ark_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: ark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: local_test_only
      PGHOST: 127.0.0.1
      PGUSER: ark_test
      PGDATABASE: ark_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -h 127.0.0.1 -U ark_test -d ark_test -v ON_ERROR_STOP=1 -f tests/database/auth-stub.sql -f supabase/migrations/202610120001_foundation.sql -f supabase/migrations/202610120002_public_details.sql -f supabase/migrations/202610120003_projects_and_media.sql -f supabase/migrations/202610120004_media_maintenance.sql -f supabase/migrations/202610120005_pinned_reads.sql -f supabase/migrations/202610120006_upvotes.sql -f supabase/migrations/202610120007_maker_totals.sql -f supabase/migrations/202610120008_following.sql -f tests/database/foundation.sql -f tests/database/projects.sql -f tests/database/upvotes.sql -f tests/database/following.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/database/upvotes-concurrency.mjs
      - run: node tests/database/following-concurrency.mjs
